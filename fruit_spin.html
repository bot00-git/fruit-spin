<!doctype html><html lang='uk'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='apple-mobile-web-app-capable' content='yes'><title>Fruit Spin</title><style>body{margin:0;background:linear-gradient(135deg,#11162d,#35106b);font-family:Arial,sans-serif;color:white;min-height:100vh;display:flex;justify-content:center;align-items:center}.app{width:min(92vw,620px);text-align:center}.top{display:flex;justify-content:space-between;align-items:center}.title{font-size:30px;font-weight:900}.bal{background:#191f3b;padding:12px 16px;border-radius:14px;font-weight:bold}.machine{margin-top:18px;background:#171a2d;padding:20px;border-radius:25px;border:3px solid #6975ff}.reels{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.reel{height:125px;background:#fff;color:#111;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:62px}.bet{margin:15px}.bet button,.spin,.dev button{border:0;border-radius:12px;padding:12px 20px;font-weight:bold}.bet button{background:#343b60;color:#fff}.spin{width:100%;background:#ffd43b;font-size:20px}.msg{min-height:28px;margin-top:12px;font-weight:bold}.secret{position:fixed;right:7px;bottom:7px;width:30px;height:30px;border:0;border-radius:50%;opacity:.08}.panel{display:none;position:fixed;inset:auto 15px 15px auto;width:min(330px,calc(100vw - 30px));background:#11162b;border:1px solid #6772ff;border-radius:18px;padding:18px;box-shadow:0 15px 50px #000b}.panel.open{display:block}.panel input{width:100%;margin:8px 0 14px}.close{float:right;background:#343b60;color:#fff}.apply{background:#6975ff;color:white;width:100%}</style></head><body><main class='app'><div class='top'><div class='title'>🎰 Fruit Spin</div><div class='bal'>💰 <span id='balance'>1000</span></div></div><section class='machine'><div class='reels'><div class='reel' id='a'>🍎</div><div class='reel' id='b'>💎</div><div class='reel' id='c'>🍇</div></div><div class='bet'><button id='minus'>−</button> <b>Ставка: <span id='bet'>10</span></b> <button id='plus'>+</button></div><button class='spin' id='spin'>КРУТИТИ 🎰</button><div class='msg' id='msg'>Збери 3 однакові!</div></section></main><button class='secret' id='secret'>⚙️</button><div class='panel' id='panel'><button class='close' id='close'>✕</button><h3>⚙️ Налаштування</h3><label>Шанс перемоги: <output id='out'>20</output>%</label><input id='range' type='range' min='0' max='100' value='20'><label>Точний %:</label><input id='pct' type='number' min='0' max='100' value='20'><label>Баланс:</label><input id='start' type='number' min='0' value='1000'><button class='apply' id='apply'>Застосувати</button></div><script>const S=[['🍎',5],['🍋',6],['🍇',8],['💎',15],['💰',20],['⭐',50]];let bal=1000,bet=10,chance=20,busy=false;const $=x=>document.getElementById(x),rand=()=>S[Math.floor(Math.random()*S.length)][0];function render(){$('balance').textContent=bal;$('bet').textContent=bet}$('range').oninput=()=>{$('out').value=$('range').value;$('pct').value=$('range').value};$('pct').oninput=()=>{let v=Math.max(0,Math.min(100,+$('pct').value||0));$('range').value=v;$('out').value=v};$('minus').onclick=()=>{if(!busy){bet=Math.max(10,bet-10);render()}};$('plus').onclick=()=>{if(!busy){bet=Math.min(100,bet+10);render()}};$('spin').onclick=()=>{if(busy||bal<bet)return;busy=true;bal-=bet;render();$('msg').textContent='Крутиться...';let win=Math.random()*100<chance,w=win?rand():null;let vals=win?[w,w,w]:[rand(),rand(),rand()];if(!win&&vals[0]===vals[1]&&vals[1]===vals[2])vals[2]=rand();[0,1,2].forEach((i)=>{let n=0,t=setInterval(()=>{[$('a'),$('b'),$('c')][i].textContent=rand();if(++n>12+i*4){clearInterval(t);[$('a'),$('b'),$('c')][i].textContent=vals[i]}},55)});setTimeout(()=>{if(vals[0]===vals[1]&&vals[1]===vals[2]){let m=S.find(x=>x[0]===vals[0])[1],winm=bet*m;bal+=winm;$('msg').textContent='🎉 Виграш '+winm+' монет!'}else $('msg').textContent='😕 Без виграшу';busy=false;render()},1000)};$('secret').onclick=()=>{$('panel').classList.toggle('open')};$('close').onclick=()=>{$('panel').classList.remove('open')};$('apply').onclick=()=>{chance=Math.max(0,Math.min(100,+$('pct').value||0));bal=Math.max(0,+$('start').value||0);render();$('panel').classList.remove('open');$('msg').textContent='Налаштування збережено'};render();</script></body></html>
